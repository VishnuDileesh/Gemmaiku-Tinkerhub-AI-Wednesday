[project]
name = "ai-wednesday-gemmaiku"
version = "0.1.0"
description = "Fine-tuning Gemma models on Apple Silicon using MLX"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=3.6.0",
    "matplotlib>=3.11.0",
    "mlx-lm>=0.31.3",
    "mlx-tune>=0.5.1",
    "pandas>=3.0.3",
    "pronouncing>=0.3.0",
    "seaborn>=0.13.2",
    "transformers>=5.12.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemmaiku"]
